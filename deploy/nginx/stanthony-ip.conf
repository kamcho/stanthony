# St. Anthony on raw VPS IP (takes over Metrolinks IP front door).
# http://185.170.196.219/
# http://185.170.196.219:8080/
#
# TKT/Metrolinks code stays at /srv/metrolinks — only nginx public routing changes.

upstream stanthony_app_ip {
    server unix:/run/stanthony/stanthony.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name 185.170.196.219;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/stanthony/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/stanthony/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://stanthony_app_ip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

server {
    listen 8080;
    listen [::]:8080;
    server_name 185.170.196.219 _;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/stanthony/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/stanthony/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://stanthony_app_ip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
