# St. Anthony Health Centre — nginx site on the shared VPS.
# Install via deploy/cutover-from-metrolinks.sh (takes public front door from Metrolinks).
# Does NOT delete /srv/metrolinks or elearning.
#
# After you have a hospital domain, replace server_name and run certbot.

upstream stanthony_app {
    server unix:/run/stanthony/stanthony.sock fail_timeout=0;
}

# Temporary: reuse Metrolinks hostnames until hospital DNS is ready.
# Edit these when the real domain is live.
server {
    listen 80;
    listen [::]:80;
    server_name metrolinkssolutionltd.co.ke www.metrolinkssolutionltd.co.ke tickets.metrolinkssolutionltd.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 20M;

    location /static/ {
        alias /srv/stanthony/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/stanthony/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://stanthony_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
