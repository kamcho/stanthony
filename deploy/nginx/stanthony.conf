# St. Anthony Health Centre — stanthonyhcabossi.org
# Same VPS IP as Soma Smart; separate server_name only.
# Does NOT edit elearning / somasmartassesments.com.

upstream stanthony_app {
    server unix:/run/stanthony/stanthony.sock fail_timeout=0;
}

# Apex → www (optional; certbot may adjust after TLS)
server {
    listen 80;
    listen [::]:80;
    server_name stanthonyhcabossi.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 http://www.stanthonyhcabossi.org$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.stanthonyhcabossi.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2
        application/font-woff2;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location /static/ {
        alias /srv/stanthony/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /srv/stanthony/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://stanthony_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
