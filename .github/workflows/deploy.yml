name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-stanthony
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy St. Anthony (keep TKT)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "==> Connected to $(hostname)"

            APP=/srv/stanthony
            REPO=https://github.com/kamcho/stanthony.git

            if [[ ! -d "$APP/.git" ]]; then
              mkdir -p /srv
              if [[ -d "$APP" && ! -d "$APP/.git" ]]; then
                rm -rf "$APP"
              fi
              git clone "$REPO" "$APP"
            else
              git config --global --add safe.directory "$APP"
              cd "$APP"
              git fetch origin
              git reset --hard origin/main
            fi

            cd "$APP"
            echo "    HEAD: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

            chmod +x deploy.sh deploy/*.sh || true

            if ! systemctl cat stanthony-gunicorn.service &>/dev/null; then
              bash deploy/install-beside-somasmart.sh
            else
              bash deploy.sh
            fi

            if [[ ! -f /etc/nginx/sites-enabled/stanthony ]]; then
              bash deploy/cutover-from-metrolinks.sh
            else
              echo "==> Cutover already applied (stanthony nginx enabled)"
              systemctl restart stanthony-gunicorn || true
            fi

            echo "==> Smoke"
            systemctl is-active stanthony-gunicorn
            test -d /srv/metrolinks && echo "TKT still at /srv/metrolinks" || echo "NOTE: /srv/metrolinks missing"
            curl -sI -m 5 http://127.0.0.1/ | head -n 5 || true
