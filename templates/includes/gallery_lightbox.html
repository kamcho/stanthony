<div class="gallery-lightbox" id="galleryLightbox" hidden aria-hidden="true">
    <div class="gallery-lightbox-backdrop" data-close-lightbox></div>
    <div class="gallery-lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
        <button type="button" class="gallery-lightbox-close" data-close-lightbox aria-label="Close">&times;</button>
        <button type="button" class="gallery-lightbox-nav gallery-lightbox-prev" id="lightboxPrev" aria-label="Previous image">&lsaquo;</button>
        <figure class="gallery-lightbox-figure">
            <img id="lightboxImage" src="" alt="">
            <figcaption>
                <span class="gallery-lightbox-category" id="lightboxCategory"></span>
                <strong id="lightboxTitle"></strong>
                <span id="lightboxCaption"></span>
            </figcaption>
        </figure>
        <button type="button" class="gallery-lightbox-nav gallery-lightbox-next" id="lightboxNext" aria-label="Next image">&rsaquo;</button>
    </div>
</div>
