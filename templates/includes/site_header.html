{% load static %}
<header class="site-header" id="siteHeader">
    <nav class="nav container" aria-label="Main navigation">
        <a href="{% url 'index' %}" class="nav-brand">
            <img
                class="brand-logo"
                src="{% static 'img/logo.png' %}"
                alt="Saint Anthony's Health Centre Abossi"
                width="399"
                height="139"
            >
        </a>

        <div class="nav-panel" id="navPanel">
            <ul class="nav-links">
                <li><a href="{% url 'index' %}"{% if request.resolver_match.url_name == 'index' %} class="is-active"{% endif %}>Home</a></li>
                <li><a href="{% url 'about' %}"{% if request.resolver_match.url_name == 'about' %} class="is-active"{% endif %}>About</a></li>
                <li><a href="{% url 'gallery' %}"{% if request.resolver_match.url_name == 'gallery' %} class="is-active"{% endif %}>Gallery</a></li>
                <li><a href="{% url 'careers' %}"{% if request.resolver_match.url_name == 'careers' or request.resolver_match.url_name == 'career_detail' %} class="is-active"{% endif %}>Careers</a></li>
                <li><a href="{% url 'index' %}#book">Contact</a></li>
                <li><a href="{% url 'index' %}#location">Find Us</a></li>
                {% if user.is_authenticated %}
                <li><a href="{% url 'manage_dashboard' %}"{% if 'manage' in request.path %} class="is-active"{% endif %}>Manage</a></li>
                {% endif %}
            </ul>
        </div>

        <div class="nav-actions">
            {% if user.is_authenticated %}
            <a href="{% url 'manage_dashboard' %}" class="btn btn-secondary nav-signin">Manage</a>
            {% else %}
            <a href="{% url 'login' %}" class="btn btn-primary nav-signin">Sign in</a>
            {% endif %}
            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Switch between light and dark theme"
            >
                <span class="theme-toggle-icon theme-toggle-icon--sun" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.75"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="theme-toggle-icon theme-toggle-icon--moon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 6.5 6.5 0 0 0 21 14.5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                    </svg>
                </span>
            </button>

            <button
                type="button"
                class="nav-toggle"
                id="navToggle"
                aria-expanded="false"
                aria-controls="navPanel"
                aria-label="Open menu"
            >
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="nav-toggle-bar" aria-hidden="true"></span>
            </button>
        </div>
    </nav>
    <div class="nav-backdrop" id="navBackdrop" hidden aria-hidden="true"></div>
</header>
